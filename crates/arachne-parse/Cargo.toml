[package]
name = "arachne-parse"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "DOM parsing and CSS selection for Arachne"

[dependencies]
scraper = "0.27"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
arachne-domain = { path = "../arachne-domain" }

[dev-dependencies]
bytes = "1"

[lib]
doctest = false