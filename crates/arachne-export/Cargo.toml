[package]
name = "arachne-export"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Export crawled records to CSV / JSONL / SQLite"

[features]
default = []
# SQLite backend (requires C toolchain for `rusqlite` `bundled`; native on Linux).
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
arachne-domain = { path = "../arachne-domain" }

[dev-dependencies]
tempfile = "3"
