[package]
name = "arachne-domain"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Domain types (Newtype) and errors for Arachne"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
bytes = "1"

[dev-dependencies]
serde_json = "1"