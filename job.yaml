# Пример декларативного задания Фазы A («штамп», веха M3)
# Запуск: arachne crawl --job job.yaml --output out.csv --delay-ms 300
start_urls:
  - https://example.com/
  - https://example.org/

# CSS-селекторы: что вытащить со страницы (первое совпадение на селектор)
selectors:
  - name: title
    selector: h1
  - name: header
    selector: "title"

# Опционально: пул прокси (round-robin)
# proxies:
#   - http://user:pass@1.2.3.4:8080
#   - socks5://5.6.7.8:1080

# Опционально: ограничение числа страниц
# limit: 100