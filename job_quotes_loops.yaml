# Парсинг quotes.toscrape.com с циклом (loops)
# Декартово произведение: {page} подставляется в URL
# Запуск: arachne crawl --job job_quotes_loops.yaml --output quotes_loops.jsonl --delay-ms 300

start_urls:
  - https://quotes.toscrape.com/page/{page}/

# Цикл подстановки {page} в URL (диапазон 1..=10)
loops:
  - var: page
    range: { start: 1, end: 10 }

# Вложенные селекторы: цитаты с тегами
nested_selectors:
  - repeat_selector: .quote
    fields:
      - name: quote_text
        selector: .text
      - name: quote_author
        selector: .author
    nested:
      - repeat_selector: .tags .tag
        fields:
          - name: tag_name
            selector: "."